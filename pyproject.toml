[project]
name = "agent-town"
version = "0.16.0"
description = "Agent 小镇世界运行时（内核 + 机制插件 + 观测站）"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2",
  "pyyaml>=6",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
town = "world.http_app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["world*", "observer*"]

[tool.setuptools.package-data]
world = ["profiles/*.yml"]
